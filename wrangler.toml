# AI advisor backend — Cloudflare Worker.
# Deploy:   npx wrangler deploy
# Secrets:  npx wrangler secret put ANTHROPIC_API_KEY
#           npx wrangler secret put ACCESS_CODE
name = "sailing-navigator-ai"
main = "server/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://geopapak.github.io"

# Accounts and synced boats/courses (schema in migrations/).
[[d1_databases]]
binding = "DB"
database_name = "sailing-navigator"
database_id = "80257e2c-0db6-435c-a048-a0557a957619"
migrations_dir = "migrations"

# Workers Logs: keeps the server's log lines (one JSON per request / AI call / account event)
# searchable in the Cloudflare dashboard → Workers & Pages → sailing-navigator-ai → Logs.
[observability]
enabled = true
head_sampling_rate = 1

# ---------------------------------------------------------------------------
# Staging (test) environment — P-044. Its own Worker, its own D1, its own secrets.
# Deploy:   npx wrangler deploy --env staging
# Secrets:  npx wrangler secret put <NAME> --env staging   (never the production values)
# Wrangler does not inherit vars or bindings into an env: everything the Worker
# needs is repeated below. Setup steps: docs/TECHNICAL.md § Περιβάλλον δοκιμών (staging).
# ---------------------------------------------------------------------------
[env.staging]
name = "sailing-navigator-ai-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
# Origin of the Cloudflare Pages test app. If the Pages project gets another name,
# change it here (comma-separated list allowed).
ALLOWED_ORIGINS = "https://sailing-navigator-staging.pages.dev"
# Low server-wide cap for paid AI calls in staging (P-016 brakes stay on).
AI_GLOBAL_MONTHLY_LIMIT = "100"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "sailing-navigator-staging"
# Placeholder: paste the id printed by `npx wrangler d1 create sailing-navigator-staging`.
database_id = "88faf2a5-18fa-43a2-abbd-e4ba7cadbe13"
migrations_dir = "migrations"

[env.staging.observability]
enabled = true
head_sampling_rate = 1
