<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>Ανάγνωση με AI</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0b2a4a}a:hover{color:#163f6b}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; display: flex; flex-direction: column; padding: 56px 24px 24px">
<h1 style="margin: 0 0 6px; font-size: 26px; font-weight: 700">Διαβάζω το πιστοποιητικό</h1>
<p style="margin: 0 0 22px; font-size: 15px; color: #4b5563">GRE-4711_ORC_2026.pdf · 3 σελίδες</p>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<div style="display: flex; gap: 14px; align-items: center; min-height: 52px; border-bottom: 1px solid #e5e7eb">
<sc-if value="{{s.done}}" hint-placeholder-val="{{false}}">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="ολοκληρώθηκε" role="img"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
<sc-if value="{{s.active}}" hint-placeholder-val="{{false}}">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0b2a4a" stroke-width="2.4" stroke-linecap="round" aria-label="σε εξέλιξη" role="img"><path d="M12 3a9 9 0 1 0 9 9"></path></svg>
</sc-if>
<sc-if value="{{s.waiting}}" hint-placeholder-val="{{true}}">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" aria-label="σε αναμονή" role="img"><circle cx="12" cy="12" r="8"></circle></svg>
</sc-if>
<span style="font-size: 16px; font-weight: 600; color: {{s.color}}">{{s.label}}</span>
</div>
</sc-for>
</div>
<p style="margin: 20px 0 0; font-size: 14px; line-height: 1.5; color: #4b5563">Συνήθως 20–40 δευτερόλεπτα. Αν κλείσεις την οθόνη, η ανάγνωση συνεχίζεται και τα αποτελέσματα σε περιμένουν στα «Σκάφη».</p>
<div style="flex-grow: 1"></div>
<sc-if value="{{finished}}" hint-placeholder-val="{{false}}">
<a href="Review.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: #0b2a4a; color: #ffffff; font-size: 18px; font-weight: 700; text-decoration: none">Δες τα στοιχεία</a>
</sc-if>
<sc-if value="{{running}}" hint-placeholder-val="{{true}}">
<a href="BoatsEmpty.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; border: 2px solid #9ca3af; color: #374151; font-size: 17px; font-weight: 700; text-decoration: none">Ακύρωση</a>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { step: 0 };
}
componentDidMount() {
this.timer = setInterval(() => {
if (this.state.step >= 5) { clearInterval(this.timer); return; }
this.setState({ step: this.state.step + 1 });
}, 1100);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const labels = ['Στοιχεία σκάφους και GPH', 'Πίνακας ταχυτήτων (polars)', 'Γωνίες όρτσας και πρίμα', 'Επιλογές βαθμολογίας ToT / ToD', 'Έλεγχος συνέπειας τιμών'];
const step = this.state.step;
return {
steps: labels.map((label, i) => ({
label: label,
done: i < step,
active: i === step,
waiting: i > step,
color: i > step ? '#6b7280' : '#000000'
})),
finished: step >= 5,
running: step < 5
};
}
}
</script>
</body>
</html>
