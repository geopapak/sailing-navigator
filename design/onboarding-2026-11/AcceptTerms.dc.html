<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>Αποδοχή όρων</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0b2a4a}a:hover{color:#163f6b}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; display: flex; flex-direction: column; padding: 56px 24px 24px">
<h1 style="margin: 0 0 10px; font-size: 26px; font-weight: 700">Νέοι όροι χρήσης</h1>
<p style="margin: 0 0 18px; font-size: 16px; line-height: 1.5; color: #374151">Για να συνεχίσεις να χρησιμοποιείς την εφαρμογή, διάβασε και αποδέξου τους όρους. Τι άλλαξε:</p>
<ul style="margin: 0 0 18px; padding-left: 22px; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; gap: 6px">
<li>Πρώτη έκδοση όρων και πολιτικής απορρήτου (GDPR).</li>
<li>Ανάγνωση πιστοποιητικών PDF με AI.</li>
<li>Εξαγωγή των δεδομένων σου από τον Λογαριασμό.</li>
</ul>
<div style="display: flex; flex-direction: column; gap: 4px; border: 1px solid #d1d5db; border-radius: 12px; padding: 6px 12px; background: #f9fafb">
<label style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.4; padding: 10px 0; border-bottom: 1px solid #e5e7eb">
<input type="checkbox" checked="{{terms}}" onChange="{{toggleTerms}}" style="width: 24px; height: 24px; margin: 0; flex-shrink: 0; accent-color: #0b2a4a">
<span>Αποδέχομαι τους <a href="Terms.dc.html" style="font-weight: 600">Όρους χρήσης</a></span></label>
<label style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.4; padding: 10px 0">
<input type="checkbox" checked="{{privacy}}" onChange="{{togglePrivacy}}" style="width: 24px; height: 24px; margin: 0; flex-shrink: 0; accent-color: #0b2a4a">
<span>Συναινώ στην <a href="Privacy.dc.html" style="font-weight: 600">Πολιτική απορρήτου</a></span></label>
</div>
<div style="flex-grow: 1"></div>
<sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
<a href="BoatsList.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: #0b2a4a; color: #ffffff; font-size: 18px; font-weight: 700; text-decoration: none">Συνέχεια</a>
</sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: #e5e7eb; color: #4b5563; font-size: 18px; font-weight: 700">Συνέχεια</div>
</sc-if>
<a href="Main.dc.html" style="text-align: center; font-size: 15px; font-weight: 600; padding: 14px 0 0">Δεν συμφωνώ — αποσύνδεση</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { terms: false, privacy: false };
}
renderVals() {
const ready = this.state.terms && this.state.privacy;
return {
terms: this.state.terms,
privacy: this.state.privacy,
ready: ready,
notReady: !ready,
toggleTerms: () => this.setState({ terms: !this.state.terms }),
togglePrivacy: () => this.setState({ privacy: !this.state.privacy })
};
}
}
</script>
</body>
</html>
