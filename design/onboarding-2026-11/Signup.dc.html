<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>Εγγραφή</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0b2a4a}a:hover{color:#163f6b}
input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; display: flex; flex-direction: column; padding: 20px 24px 24px">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600; text-decoration: none; min-height: 44px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Πίσω</a>
<h1 style="margin: 8px 0 18px; font-size: 26px; font-weight: 700">Νέος λογαριασμός</h1>
<div style="display: flex; flex-direction: column; gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #374151">Όνομα
<input type="text" placeholder="Γιώργος" style="height: 50px; border: 2px solid #9ca3af; border-radius: 10px; padding: 0 14px; font-size: 17px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #374151">Email
<input type="email" placeholder="name@example.gr" style="height: 50px; border: 2px solid #9ca3af; border-radius: 10px; padding: 0 14px; font-size: 17px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #374151">Κωδικός
<input type="password" placeholder="Τουλάχιστον 8 χαρακτήρες" style="height: 50px; border: 2px solid #9ca3af; border-radius: 10px; padding: 0 14px; font-size: 17px"></label>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; margin-top: 18px; border: 1px solid #d1d5db; border-radius: 12px; padding: 6px 12px; background: #f9fafb">
<label style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.4; padding: 10px 0; border-bottom: 1px solid #e5e7eb">
<input type="checkbox" checked="{{terms}}" onChange="{{toggleTerms}}" style="width: 24px; height: 24px; margin: 0; flex-shrink: 0; accent-color: #0b2a4a">
<span>Αποδέχομαι τους <a href="Terms.dc.html" style="font-weight: 600">Όρους χρήσης</a> <span style="color: #b91c1c">*</span></span></label>
<label style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.4; padding: 10px 0; border-bottom: 1px solid #e5e7eb">
<input type="checkbox" checked="{{privacy}}" onChange="{{togglePrivacy}}" style="width: 24px; height: 24px; margin: 0; flex-shrink: 0; accent-color: #0b2a4a">
<span>Διάβασα την <a href="Privacy.dc.html" style="font-weight: 600">Πολιτική απορρήτου</a> και συναινώ στην επεξεργασία των δεδομένων μου (GDPR) <span style="color: #b91c1c">*</span></span></label>
<label style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.4; padding: 10px 0">
<input type="checkbox" style="width: 24px; height: 24px; margin: 0; flex-shrink: 0; accent-color: #0b2a4a">
<span style="color: #374151">Θέλω email για νέες λειτουργίες (προαιρετικό)</span></label>
</div>
<p style="margin: 8px 0 0; font-size: 13px; color: #4b5563"><span style="color: #b91c1c">*</span> υποχρεωτικό</p>
<div style="flex-grow: 1"></div>
<sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
<a href="BoatsEmpty.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: #0b2a4a; color: #ffffff; font-size: 18px; font-weight: 700; text-decoration: none">Δημιουργία λογαριασμού</a>
</sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 14px; color: #b45309; text-align: center">Τσέκαρε τους όρους και την πολιτική απορρήτου για να συνεχίσεις</p>
<div style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: #e5e7eb; color: #4b5563; font-size: 18px; font-weight: 700">Δημιουργία λογαριασμού</div>
</div>
</sc-if>
<p style="margin: 14px 0 0; text-align: center; font-size: 15px; color: #4b5563">Έχεις λογαριασμό; <a href="Main.dc.html" style="font-weight: 600">Σύνδεση</a></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { terms: false, privacy: false };
}
renderVals() {
const ready = this.state.terms && this.state.privacy;
return {
terms: this.state.terms,
privacy: this.state.privacy,
ready: ready,
notReady: !ready,
toggleTerms: () => this.setState({ terms: !this.state.terms }),
togglePrivacy: () => this.setState({ privacy: !this.state.privacy })
};
}
}
</script>
</body>
</html>
