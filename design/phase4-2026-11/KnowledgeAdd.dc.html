<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>Νέα σημείωση</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0b2a4a}a:hover{color:#163f6b}
textarea{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 8px; background: #0b2a4a; color: #ffffff">
<a href="KnowledgeList.dc.html" aria-label="Πίσω" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #ffffff">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<span style="font-size: 18px; font-weight: 700">Νέα σημείωση</span>
</div>
<div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600; color: #374151">Πού</span>
<div style="position: relative; height: 150px; border-radius: 12px; overflow: hidden; border: 1px solid #d1d5db; background: #eef4f8">
<svg width="356" height="150" viewBox="0 0 356 150" role="img" aria-label="Χάρτης με καρφίτσα στη βόρεια ακτή της Αίγινας">
<path d="M90 150 C100 95 170 70 240 88 C285 100 300 130 296 150 Z" fill="#d6d3c4"></path>
<circle cx="190" cy="66" r="44" fill="#0b2a4a" fill-opacity="0.12" stroke="#0b2a4a" stroke-width="1.5" stroke-dasharray="4 4"></circle>
<path d="M190 66 m0 -22 c-8 0 -14 6 -14 14 c0 10 14 24 14 24 c0 0 14 -14 14 -24 c0 -8 -6 -14 -14 -14 z" fill="#c2410c"></path>
<text x="140" y="138" font-size="12" font-weight="700" fill="#000000">Αίγινα</text>
</svg>
</div>
<div style="display: flex; gap: 8px">
<button type="button" style="flex: 1; min-height: 44px; border-radius: 10px; border: 2px solid #0b2a4a; background: #ffffff; color: #0b2a4a; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer">Εδώ που είμαι (GPS)</button>
<span style="display: flex; align-items: center; font-size: 13px; color: #374151">ακτίνα ~1 NM</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600; color: #374151">Με τι άνεμο ισχύει</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{dirs}}" as="d" hint-placeholder-count="8">
<button type="button" onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="min-width: 48px; min-height: 44px; border-radius: 10px; border: 2px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer">{{d.label}}</button>
</sc-for>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{speeds}}" as="s" hint-placeholder-count="3">
<button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="min-height: 40px; padding: 0 12px; border-radius: 20px; border: 2px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer">{{s.label}}</button>
</sc-for>
</div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #374151">Τι παρατήρησες
<textarea rows="4" placeholder="π.χ. Κοντά στην ακτή ο άνεμος στρίβει δεξιά και πέφτει· μένουμε 1 NM έξω." style="border: 2px solid #9ca3af; border-radius: 10px; padding: 10px; font-size: 15px; resize: vertical"></textarea></label>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600; color: #374151">Ποιος τη βλέπει</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{scopes}}" as="c" hint-placeholder-count="2">
<button type="button" onClick="{{c.pick}}" style="min-height: 48px; border-radius: 10px; border: 2px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
<span style="font-size: 12px; color: #4b5563">«Πλήρωμα» = όσοι έχουν το ίδιο σκάφος στον λογαριασμό τους.</span>
</div>
</div>
<div style="padding: 12px 16px 16px; border-top: 1px solid #e5e7eb">
<a href="KnowledgeList.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: #0b2a4a; color: #ffffff; font-size: 18px; font-weight: 700; text-decoration: none">Αποθήκευση</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { dirs: { 'Β': true, 'ΒΑ': true }, speed: 'mid', scope: 'crew' };
}
renderVals() {
const st = this.state;
const look = (on) => ({ border: on ? '#0b2a4a' : '#d1d5db', bg: on ? '#0b2a4a' : '#ffffff', fg: on ? '#ffffff' : '#000000', on: on ? 'true' : 'false' });
const dirs = ['Β', 'ΒΑ', 'Α', 'ΝΑ', 'Ν', 'ΝΔ', 'Δ', 'ΒΔ'].map((k) => Object.assign({ label: k, pick: () => this.setState({ dirs: Object.assign({}, st.dirs, { [k]: !st.dirs[k] }) }) }, look(!!st.dirs[k])));
const speeds = [['low', 'Ελαφρύς < 8 kt'], ['mid', 'Μέτριος 8–18'], ['high', 'Δυνατός > 18']].map(([k, label]) => Object.assign({ label: label, pick: () => this.setState({ speed: k }) }, look(st.speed === k)));
const scopes = [['me', 'Μόνο εγώ'], ['crew', 'Πλήρωμα']].map(([k, label]) => Object.assign({ label: label, pick: () => this.setState({ scope: k }) }, look(st.scope === k)));
return { dirs: dirs, speeds: speeds, scopes: scopes };
}
}
</script>
</body>
</html>
