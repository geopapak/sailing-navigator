<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>Όργανα σκάφους</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0b2a4a}a:hover{color:#163f6b}
input,select{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 8px; background: #0b2a4a; color: #ffffff">
<a href="LiveAuto.dc.html" aria-label="Πίσω" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #ffffff">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<span style="font-size: 18px; font-weight: 700">Όργανα σκάφους</span>
</div>
<div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; border: 2px solid {{statusBorder}}; background: {{statusBg}}">
<span style="width: 14px; height: 14px; border-radius: 7px; background: {{statusDot}}; flex-shrink: 0"></span>
<div style="display: flex; flex-direction: column; flex: 1"><b style="font-size: 16px">{{statusTitle}}</b><span style="font-size: 13px; color: #374151">{{statusText}}</span></div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #374151">Τύπος σύνδεσης
<select style="height: 48px; border: 2px solid #9ca3af; border-radius: 10px; padding: 0 10px; font-size: 16px; background: #ffffff">
<option>Signal K (WebSocket)</option>
<option>NMEA 0183 μέσω WebSocket</option>
<option>Προσομοίωση (για δοκιμή)</option>
</select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #374151">Διεύθυνση gateway
<input type="text" value="ws://192.168.1.10:3000/signalk/v1/stream" style="height: 48px; border: 2px solid #9ca3af; border-radius: 10px; padding: 0 12px; font-size: 15px"></label>
<p style="margin: 0; font-size: 13px; line-height: 1.45; color: #4b5563">Το κινητό συνδέεται στο Wi-Fi του σκάφους. Η διεύθυνση γράφεται στο εγχειρίδιο του gateway (π.χ. Signal K server σε Raspberry Pi, Yacht Devices, Digital Yacht).</p>
<sc-if value="{{off}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{connect}}" style="height: 52px; border: 0; border-radius: 12px; background: #0b2a4a; color: #ffffff; font-size: 17px; font-weight: 700; font-family: inherit; cursor: pointer">Σύνδεση</button>
</sc-if>
<sc-if value="{{on}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{disconnect}}" style="height: 52px; border: 2px solid #9ca3af; border-radius: 12px; background: #ffffff; color: #000000; font-size: 17px; font-weight: 700; font-family: inherit; cursor: pointer">Αποσύνδεση</button>
<h2 style="margin: 6px 0 0; font-size: 15px; font-weight: 700; color: #374151">Τι λαμβάνω</h2>
<div style="border: 1px solid #d1d5db; border-radius: 12px; display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 12px; border-bottom: 1px solid #e5e7eb; font-size: 15px">
<span style="flex: 1">{{r.label}}</span>
<b style="font-variant-numeric: tabular-nums">{{r.value}}</b>
<span style="font-size: 12px; color: {{r.ageColor}}; width: 52px; text-align: right">{{r.age}}</span>
</div>
</sc-for>
</div>
<label style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.4; padding: 6px 0">
<input type="checkbox" checked="checked" style="width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: #0b2a4a">
<span>Καταγραφή αγώνα από τα όργανα (για την ανάλυση μετά)</span></label>
<label style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.4; padding: 6px 0">
<input type="checkbox" checked="checked" style="width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: #0b2a4a">
<span>Θέσεις αντιπάλων από το AIS του σκάφους</span></label>
<a href="LiveAuto.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #0b2a4a; color: #ffffff; font-size: 17px; font-weight: 700; text-decoration: none">Πήγαινε στο Live</a>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { on: false };
}
renderVals() {
const on = this.state.on;
return {
on: on,
off: !on,
statusTitle: on ? 'Συνδεδεμένο' : 'Χωρίς σύνδεση οργάνων',
statusText: on ? 'Signal K · 9 τιμές · τελευταία πριν 0,4 s' : 'Όλα δουλεύουν χειροκίνητα, όπως σήμερα.',
statusBg: on ? '#ecfdf5' : '#f3f4f6',
statusBorder: on ? '#047857' : '#d1d5db',
statusDot: on ? '#047857' : '#9ca3af',
rows: [
{ label: 'Αληθής άνεμος TWS', value: '12.4 kt', age: '0,4 s', ageColor: '#047857' },
{ label: 'Αληθής γωνία TWA', value: '41° δεξιά', age: '0,4 s', ageColor: '#047857' },
{ label: 'Κατεύθυνση TWD', value: '018°', age: '0,4 s', ageColor: '#047857' },
{ label: 'Ταχύτητα BSP', value: '7.21 kt', age: '0,5 s', ageColor: '#047857' },
{ label: 'Πλώρη (heading)', value: '337° μ', age: '0,2 s', ageColor: '#047857' },
{ label: 'Θέση GPS', value: '37°45.2′ 23°31.8′', age: '1 s', ageColor: '#047857' },
{ label: 'Βάθος', value: '42 m', age: '12 s', ageColor: '#b45309' },
{ label: 'AIS', value: '6 σκάφη', age: '8 s', ageColor: '#047857' }
],
connect: () => this.setState({ on: true }),
disconnect: () => this.setState({ on: false })
};
}
}
</script>
</body>
</html>
