<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Ανανέωση εμφάνισης + Προφίλ (P-049 / P-050)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" rel="stylesheet" />
<style>
  /* ---------- Canvas around the phones (not part of the design) ---------- */
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#dfe3e8; color:#111; }
  .controls { position:sticky; top:0; z-index:50; background:#fff; border-bottom:1px solid #cfd4da; padding:8px 14px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  .controls .grp { display:flex; align-items:center; gap:6px; }
  .controls label { font-size:.78rem; font-weight:700; color:#374151; }
  .pick { display:inline-flex; border:1px solid #9ca3af; border-radius:999px; overflow:hidden; flex-wrap:wrap; }
  .pick button { border:0; background:#fff; padding:7px 11px; font:inherit; font-size:.82rem; font-weight:600; min-height:38px; cursor:pointer; }
  .pick button + button { border-left:1px solid #d1d5db; }
  .pick button.on { background:#0b2a4a; color:#fff; }
  .page { display:flex; flex-wrap:wrap; gap:22px; padding:20px 14px 40px; justify-content:center; align-items:flex-start; }
  .phones { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; }
  .cap { text-align:center; font-size:.8rem; font-weight:700; color:#374151; margin:6px 0 0; }
  .notes { width:460px; max-width:100%; background:#fff; border-radius:16px; padding:16px 20px; line-height:1.5; font-size:.93rem; box-sizing:border-box; }
  .notes h2 { margin:.1em 0 .4em; font-size:1.2rem; } .notes h3 { margin:1em 0 .3em; font-size:1rem; }
  .notes ul, .notes ol { padding-left:1.2em; margin:.3em 0; }
  .notes table { border-collapse:collapse; width:100%; font-size:.84rem; margin:.4em 0; }
  .notes td, .notes th { border:1px solid #d1d5db; padding:4px 6px; text-align:left; vertical-align:top; }
  .tag { display:inline-block; font-size:.72rem; font-weight:800; padding:2px 7px; border-radius:6px; background:#dcfce7; color:#14532d; margin-right:4px; }
  .tag.same { background:#e5e7eb; color:#374151; } .tag.ask { background:#fef3c7; color:#78350f; }
  .warnbox { background:#fef3c7; border-left:4px solid #b45309; padding:8px 10px; border-radius:6px; font-size:.86rem; }

  /* =====================================================================
     DESIGN TOKENS (proposal). Names map 1:1 to CSS variables for src/ui/styles.css.
     ===================================================================== */
  .phone[data-theme='day'] {
    --bg:#ffffff; --surface:#f2f4f7; --surface-2:#e4e8ee; --fg:#05080f; --muted:#475467; --line:#667085; --line-soft:#d0d5dd;
    --accent:#0b2a4a; --accent-fg:#ffffff; --accent-cont:#dbe7f5; --on-accent-cont:#0b2a4a;
    --good:#047857; --good-cont:#d1fae5; --fair:#b45309; --fair-cont:#fef3c7; --bad:#b91c1c; --bad-cont:#fee2e2;
    --stbd:#047857; --port:#b91c1c; --scrim:rgba(5,8,15,.48);
    --shadow-1:0 1px 2px rgba(16,24,40,.10),0 1px 3px rgba(16,24,40,.10); --shadow-2:0 8px 24px rgba(16,24,40,.18);
  }
  .phone[data-theme='dark'] {
    --bg:#0b1220; --surface:#152033; --surface-2:#1e2b42; --fg:#f8fafc; --muted:#a3b1c6; --line:#6b7c96; --line-soft:#2a3a55;
    --accent:#7cb4ff; --accent-fg:#0b1220; --accent-cont:#1e3a5f; --on-accent-cont:#dbeafe;
    --good:#34d399; --good-cont:#0f3b2e; --fair:#fbbf24; --fair-cont:#3d2e0a; --bad:#f87171; --bad-cont:#3f1616;
    --stbd:#34d399; --port:#f87171; --scrim:rgba(0,0,0,.6);
    --shadow-1:none; --shadow-2:0 8px 24px rgba(0,0,0,.5);
  }
  .phone[data-theme='night'] {
    --bg:#000000; --surface:#120202; --surface-2:#1c0403; --fg:#ff3b30; --muted:#d8372c; --line:#b02a20; --line-soft:#4a0b07;
    --accent:#ff3b30; --accent-fg:#000000; --accent-cont:#2a0503; --on-accent-cont:#ff3b30;
    --good:#ff6b5e; --good-cont:#2a0503; --fair:#d1342a; --fair-cont:#2a0503; --bad:#ff3b30; --bad-cont:#2a0503;
    --stbd:#ff6b5e; --port:#d8372c; --scrim:rgba(0,0,0,.78);
    --shadow-1:none; --shadow-2:none;
  }
  .phone {
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
    --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:28px; --r-pill:999px;
    --hit:48px; --hit-main:56px;
    --dur-1:120ms; --dur-2:220ms; --ease:cubic-bezier(.2,0,0,1);
  }

  /* ---------- Phone frame ---------- */
  .phone { width:var(--pw,375px); height:812px; max-width:100%; border-radius:34px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.28); border:10px solid #111; position:relative; display:flex; flex-direction:column; background:var(--bg); color:var(--fg); font-family:var(--font); font-size:17px; font-weight:500; line-height:1.35; }
  .phone.sz-l { font-size:20px; } .phone.sz-xl { font-size:23px; }
  .phone * { box-sizing:border-box; }
  .phone button, .phone input { font:inherit; color:inherit; }
  .phone button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .phone :focus-visible { outline:3px solid var(--fg); outline-offset:2px; }
  .num { font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .muted { color:var(--muted); }
  .cap2 { font-size:.8em; font-weight:600; color:var(--muted); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  .ic { width:1.3em; height:1.3em; flex-shrink:0; }
  .scr { flex:1; overflow-y:auto; overflow-x:hidden; padding:var(--s3) var(--s4) var(--s5); position:relative; }

  /* Top bar (outside a session): boat chip left, avatar right. */
  .top { display:flex; align-items:center; gap:var(--s2); padding:var(--s2) var(--s3); min-height:68px; background:var(--bg); border-bottom:1px solid var(--line-soft); }
  .top .ttl { flex:1; min-width:0; font-weight:800; font-size:1.1em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .boatchip { display:flex; align-items:center; gap:6px; min-height:var(--hit); max-width:72%; padding:0 14px 0 10px; border-radius:var(--r-pill); border:2px solid var(--line); background:var(--surface); font-weight:800; }
  .boatchip span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .iconbtn { min-width:var(--hit); min-height:var(--hit); border-radius:var(--r-pill); border:0; background:none; display:inline-flex; align-items:center; justify-content:center; font-weight:800; }
  .avbtn { position:relative; border:0; background:none; padding:0; width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-left:auto; flex-shrink:0; }
  .avbtn .dot { position:absolute; right:2px; bottom:2px; width:14px; height:14px; border-radius:50%; background:var(--good); border:3px solid var(--bg); }
  .avbtn .dot.off { background:var(--fair); }

  /* Status strip (only when something is wrong). */
  .strip { display:flex; gap:var(--s2); align-items:center; padding:8px var(--s4); min-height:44px; font-size:.84em; font-weight:700; background:var(--fair-cont); color:var(--fg); border-bottom:2px solid var(--fair); }
  .strip.bad { background:var(--bad-cont); border-bottom-color:var(--bad); }
  .strip .d { width:10px; height:10px; border-radius:5px; background:var(--fair); flex-shrink:0; }
  .strip.bad .d { background:var(--bad); }

  /* Cards */
  .c { background:var(--surface); border-radius:var(--r-l); padding:var(--s4); margin-bottom:var(--s3); border:1px solid var(--line-soft); box-shadow:var(--shadow-1); }
  .c.flat { box-shadow:none; }
  .sec { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; margin:var(--s5) 2px var(--s2); min-height:44px; gap:0 8px; }
  .sec h3 { white-space:nowrap; }
  .sec h3 { margin:0; font-size:1.05em; font-weight:800; }
  .sec .lnk { background:none; border:0; min-height:var(--hit); font-weight:800; color:var(--accent); padding:0 6px; }
  .phone[data-theme='night'] .sec .lnk { color:var(--fg); text-decoration:underline; }
  .hello { font-size:1.45em; font-weight:800; margin:var(--s2) 2px var(--s3); letter-spacing:-.01em; }

  /* Buttons */
  .b { min-height:var(--hit); padding:0 18px; border-radius:var(--r-m); border:2px solid transparent; font-weight:800; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform var(--dur-1) var(--ease), filter var(--dur-1); text-align:center; line-height:1.15; }
  .b:active { transform:scale(.98); filter:brightness(.92); }
  .b.main { min-height:var(--hit-main); font-size:1.05em; }
  .b.wide { width:100%; }
  .b.fill { background:var(--accent); color:var(--accent-fg); }
  .b.tonal { background:var(--accent-cont); color:var(--on-accent-cont); }
  .b.out { background:var(--bg); border-color:var(--line); color:var(--fg); }
  .b.text { background:none; color:var(--accent); padding:0 10px; }
  .b.danger { background:var(--bg); border-color:var(--bad); color:var(--bad); }
  .b.dangerfill { background:var(--bad); color:var(--bg); }
  .b:disabled { opacity:.45; cursor:default; transform:none; filter:none; }
  .phone[data-theme='night'] .b.fill, .phone[data-theme='night'] .b.dangerfill { background:#000; color:var(--fg); border-color:var(--fg); box-shadow:inset 0 0 0 1px var(--fg); }
  .phone[data-theme='night'] .b.tonal { border-color:var(--line); }
  .phone[data-theme='night'] .b.text { color:var(--fg); text-decoration:underline; }
  .brow { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--s2); }

  /* Mode cards (Home) */
  .mode { display:grid; grid-template-columns:60px minmax(0,1fr) auto; gap:14px; align-items:center; width:100%; text-align:left; min-height:92px; border:2px solid var(--line-soft); background:var(--surface); border-radius:var(--r-l); padding:12px 14px; margin-bottom:var(--s2); box-shadow:var(--shadow-1); transition:transform var(--dur-1) var(--ease); }
  .mode:active { transform:scale(.985); }
  .mode .mi { width:60px; height:60px; border-radius:18px; background:var(--accent-cont); color:var(--on-accent-cont); display:flex; align-items:center; justify-content:center; }
  .mode.race .mi { background:var(--accent); color:var(--accent-fg); }
  .phone[data-theme='night'] .mode .mi { background:#000; color:var(--fg); border:2px solid var(--fg); }
  .mode b { display:block; font-size:1.25em; font-weight:800; }
  .mode .d { display:block; font-size:.82em; font-weight:600; color:var(--muted); }
  .mode .go { width:28px; height:28px; color:var(--muted); }
  .phone[data-theme='night'] .mode { border-color:var(--line); }
  .mode.need { border-style:dashed; box-shadow:none; }

  .next { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--s3); align-items:center; }
  .next .cd { text-align:center; background:var(--accent); color:var(--accent-fg); border-radius:var(--r-m); padding:8px 12px; min-width:88px; }
  .phone[data-theme='night'] .next .cd { background:#000; color:var(--fg); border:2px solid var(--fg); }
  .next .cd b { display:block; font-size:1.5em; font-weight:900; line-height:1; }
  .next .cd span { font-size:.72em; font-weight:800; }
  .chiprow { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .schip { display:inline-flex; align-items:center; gap:4px; min-height:30px; padding:2px 10px; border-radius:var(--r-pill); background:var(--bg); border:1.5px solid var(--line); font-size:.76em; font-weight:700; white-space:nowrap; }
  .schip.good { border-color:var(--good); } .schip.fair { border-color:var(--fair); }

  .quick { display:flex; align-items:center; gap:12px; width:100%; min-height:60px; border:2px dashed var(--line); background:none; border-radius:var(--r-l); padding:8px 14px; font-weight:800; text-align:left; }
  .quick .d { display:block; font-weight:600; font-size:.8em; color:var(--muted); }

  .hc { display:grid; grid-template-columns:48px minmax(0,1fr) auto; gap:12px; align-items:center; width:100%; text-align:left; border:0; background:none; padding:10px 4px; min-height:72px; border-top:1px solid var(--line-soft); }
  .hc:first-child { border-top:0; }
  .hc .hi { width:48px; height:48px; border-radius:14px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; }
  .hc b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hc .s { display:block; font-size:.8em; font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hc .m { font-size:.9em; font-weight:800; text-align:right; }

  /* Empty state */
  .empty { text-align:center; padding:var(--s5) var(--s4); }
  .empty svg { width:64px; height:64px; display:block; margin:0 auto var(--s2); color:var(--muted); }
  .empty b { display:block; font-size:1.08em; margin-bottom:4px; }
  .empty p { margin:0 0 var(--s3); color:var(--muted); font-size:.9em; }

  /* Bottom navigation (M3 style, active pill). */
  .nav { display:grid; grid-template-columns:repeat(var(--n,4),minmax(0,1fr)); background:var(--surface); border-top:1px solid var(--line-soft); padding:6px 4px 14px; }
  .nav button { background:none; border:0; min-height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:.74em; font-weight:700; color:var(--muted); min-width:0; }
  .nav button .pill { width:64px; height:34px; border-radius:17px; display:flex; align-items:center; justify-content:center; transition:background var(--dur-2) var(--ease); }
  .nav button.on { color:var(--fg); font-weight:800; }
  .nav button.on .pill { background:var(--accent-cont); color:var(--on-accent-cont); }
  .phone[data-theme='night'] .nav button.on .pill { background:#000; border:2px solid var(--fg); color:var(--fg); }
  .nav button span.l { max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Session bar */
  .sbar { display:flex; align-items:center; gap:var(--s2); padding:var(--s2) var(--s3); background:var(--accent); color:var(--accent-fg); min-height:76px; }
  .phone[data-theme='night'] .sbar { background:#000; color:var(--fg); border-bottom:2px solid var(--line); }
  .sbar .mode2 { flex:1; min-width:0; line-height:1.15; }
  .sbar .mode2 b { display:flex; align-items:center; gap:6px; font-size:.82em; font-weight:800; letter-spacing:.04em; }
  .sbar .mode2 .clk { display:block; font-size:1.5em; font-weight:900; }
  .narrow.sz-xl .sbar .mode2 .clk, .narrow.sz-l .sbar .mode2 .clk { font-size:1.15em; }
  .narrow.sz-xl .sbar .sb.endb { min-width:0; }
  .sbar .mode2 .s { display:block; font-size:.74em; font-weight:700; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rec { width:12px; height:12px; border-radius:6px; background:#ef4444; box-shadow:0 0 0 2px currentColor; animation:pulse 1.6s infinite; }
  .phone[data-theme='night'] .rec { background:var(--fg); box-shadow:none; }
  @keyframes pulse { 50% { opacity:.35; } }
  .sb { min-width:52px; min-height:52px; border-radius:var(--r-m); border:2px solid currentColor; background:none; color:inherit; font-weight:900; padding:0 10px; display:inline-flex; align-items:center; justify-content:center; gap:4px; }

  /* Live */
  .band { border-radius:var(--r-l); padding:10px 14px; margin-bottom:var(--s2); min-height:84px; display:flex; flex-direction:column; justify-content:center; }
  .band.warn { background:var(--fair); color:var(--bg); }
  .band.idle { background:var(--surface); min-height:56px; border:1px solid var(--line-soft); }
  .band .big { font-size:1.55em; font-weight:900; line-height:1.05; }
  .band.idle .big { font-size:1em; font-weight:800; }
  .band .sub { font-weight:800; font-size:.88em; margin-top:4px; }
  .phone[data-theme='night'] .band.warn { background:#000; color:var(--fg); border:3px solid var(--fg); }
  .phone[data-theme='dark'] .band.warn { color:#0b1220; }
  .t { background:var(--surface); border-radius:var(--r-l); padding:10px 14px; border:1px solid var(--line-soft); min-width:0; }
  .t .lab { font-weight:800; font-size:.86em; display:flex; flex-wrap:wrap; justify-content:space-between; gap:0 6px; }
  .t .lab .ab { color:var(--muted); font-weight:700; }
  .t .val { font-weight:900; line-height:1; white-space:nowrap; font-size:2.6em; margin-top:4px; }
  .t .val small { font-size:.4em; font-weight:800; margin-left:2px; }
  .t .sub { font-size:.82em; font-weight:700; color:var(--muted); margin-top:4px; }
  .t .sub.good { color:var(--good); } .t .sub.fair { color:var(--fair); }
  .t.hero { padding:12px 16px; border:2px solid var(--line); }
  .t.hero .val { font-size:4.4em; }
  .bar { height:10px; border-radius:5px; background:var(--surface-2); margin-top:8px; overflow:hidden; border:1px solid var(--line-soft); }
  .bar i { display:block; height:100%; background:var(--good); border-radius:5px; transition:width var(--dur-2) var(--ease); }
  .g2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--s2); margin:var(--s2) 0; }
  .g3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--s2); }
  .g3 .t { padding:8px 10px; } .g3 .t .val { font-size:1.45em; } .g3 .t .lab { font-size:.76em; }
  .tws .val.stbd { color:var(--stbd); } .tws .val.port { color:var(--port); }
  .narrow.sz-xl .t.hero .val { font-size:3.4em; }
  .narrow.sz-xl .g2 .t .val { font-size:2em; }
  .narrow.sz-xl .g3 { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  .narrow.sz-xl .g3 .t:last-child { grid-column:1 / -1; }
  .narrow.sz-l .g2 .t .val { font-size:2.2em; }
  .stale { opacity:.55; }
  .phone[data-theme='night'] .bar i { background:var(--fg); }

  /* Profile */
  .ph { text-align:center; padding:var(--s5) var(--s4) var(--s4); }
  .ph .avwrap { position:relative; width:112px; height:112px; margin:0 auto var(--s3); }
  .ph .edit { position:absolute; right:-6px; bottom:-6px; width:52px; height:52px; border-radius:50%; border:3px solid var(--surface); background:var(--accent); color:var(--accent-fg); display:flex; align-items:center; justify-content:center; }
  .phone[data-theme='night'] .ph .edit { background:#000; color:var(--fg); border-color:var(--fg); }
  .ph .nm { font-size:1.45em; font-weight:800; overflow-wrap:anywhere; }
  .ph .em { font-weight:700; overflow-wrap:anywhere; margin-top:6px; }
  .ph .priv { display:flex; gap:8px; align-items:flex-start; text-align:left; font-size:.8em; font-weight:600; color:var(--muted); background:var(--bg); border-radius:var(--r-m); padding:10px 12px; margin-top:var(--s3); }
  .stats { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--s2); }
  .stats div { background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r-l); padding:10px 14px; min-width:0; }
  .stats b { display:block; font-size:1.9em; font-weight:900; line-height:1.05; }
  .stats b small { font-size:.45em; font-weight:800; }
  .stats span { font-size:.82em; font-weight:700; color:var(--muted); }
  .list { background:var(--surface); border-radius:var(--r-l); border:1px solid var(--line-soft); overflow:hidden; }
  .rowb { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; width:100%; min-height:60px; padding:10px 14px; border:0; border-top:1px solid var(--line-soft); background:none; text-align:left; }
  .rowb:first-child { border-top:0; }
  .rowb.noic { grid-template-columns:minmax(0,1fr) auto; }
  .rowb b { display:block; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rowb .s { display:block; font-size:.8em; font-weight:600; color:var(--muted); }
  .rowb .v { font-weight:800; font-size:.9em; text-align:right; }
  .rowb .chev { width:22px; height:22px; color:var(--muted); }
  .bi { width:48px; height:48px; border-radius:14px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; }
  .role { display:inline-block; margin-top:4px; font-size:.74em; font-weight:800; padding:2px 8px; border-radius:var(--r-pill); border:1.5px solid var(--line); white-space:nowrap; }
  .role.own { background:var(--accent-cont); color:var(--on-accent-cont); border-color:transparent; }
  .role.guest { border-style:dashed; }
  .phone[data-theme='night'] .role.own { border-color:var(--fg); }

  /* Avatars */

  /* Bottom sheet (modal, one at a time, with ✕) */
  .scrim { position:absolute; inset:0; background:var(--scrim); z-index:20; display:flex; align-items:flex-end; animation:fade var(--dur-2) var(--ease); }
  .sheet { width:100%; max-height:88%; overflow-y:auto; background:var(--bg); border-radius:var(--r-xl) var(--r-xl) 0 0; padding:0 var(--s4) var(--s5); box-shadow:var(--shadow-2); animation:up var(--dur-2) var(--ease); }

<script>

];
const colorOf = (id) => (COLORS.find((c) => c[0] === id) || COLORS[0])[1];

/* Sailing-themed avatar glyphs, 64×64, drawn in currentColor on the colour disc. */
const GLYPHS = {
  initials: ['Αρχικά', (a) => `<text x="32" y="43" text-anchor="middle" font-family="Inter,system-ui" font-weight="800" font-size="30" fill="currentColor">${S.name.trim().charAt(0).toUpperCase() || '?'}</text>`],
  boat: ['Σκάφος', () => `<path d="M31 11v29H15z" fill="currentColor"/><path d="M34 15l14 25H34z" fill="currentColor" opacity=".8"/><path d="M11 43h42l-6 8H18z" fill="currentColor"/>`],

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function avatarHTML(px, a = S.avatar, usePhoto = true) {

const P = {

  img: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 17l5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="8.5" r="1.5"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  sync: '<path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2M20 4v5h-5M4 20v-5h5"/>',
  out: '<path d="M14 4h6v16h-6M10 8l-4 4 4 4M6 12h10"/>',
  down: '<path d="M12 4v11M7 10l5 5 5-5M4 20h16"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  shield: '<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/>',
  doc: '<path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/>',
  ai: '<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>',
  rotate: '<path d="M20 12a8 8 0 1 1-3-6.2M20 4v4h-4"/>',

const icon = (n, cls = 'ic') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------------- Data (fictional, Saronic) ---------------- */
const BOATS = [
  { name: 'Θέτις', sail: 'GRE 1234', role: 'own', label: 'Ιδιοκτήτης', more: '6 μέλη' },
  { name: 'Αύρα του Σαρωνικού', sail: 'GRE 2207', role: 'crew', label: 'Μέλος', more: 'Τελευταία θέση: Τακτικός' },
  { name: 'Ζέφυρος', sail: 'GRE 0915', role: 'guest', label: 'Καλεσμένος', more: '1 αγώνας · λήγει 22/11' },

/* ---------------- Crop logic (real, on-device) ---------------- */
function startCrop(img) {
  S.crop = { img, scale: 1, ox: 0, oy: 0, rot: 0 };
  S.sheet = null;
  render();
}
function cropGeom() {
  const c = S.crop, w = c.rot % 180 ? c.img.height : c.img.width, h = c.rot % 180 ? c.img.width : c.img.height;
  const base = 240 / Math.min(w, h); // circle (240) is always covered at scale 1
  return { w, h, k: base * c.scale };
}
function clampCrop() {
  const c = S.crop, g = cropGeom();
  const mx = Math.max(0, (g.w * g.k - 240) / 2), my = Math.max(0, (g.h * g.k - 240) / 2);
  c.ox = Math.max(-mx, Math.min(mx, c.ox)); c.oy = Math.max(-my, Math.min(my, c.oy));
}
function paint(ctx, size, k2) {
  const c = S.crop, g = cropGeom(), k = g.k * k2;
  ctx.save(); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, size, size);
  ctx.translate(size / 2 + c.ox * k2, size / 2 + c.oy * k2); ctx.rotate((c.rot * Math.PI) / 180);
  ctx.drawImage(c.img, (-c.img.width * k) / 2, (-c.img.height * k) / 2, c.img.width * k, c.img.height * k);
  ctx.restore();
}
function drawCrop() {
  const cv = document.querySelector('[data-cv="0"]'); if (!cv) return;
  clampCrop(); paint(cv.getContext('2d'), 300, 1);
}
function finishCrop() {
  S.crop.busy = true; render();
  const out = document.createElement('canvas'); out.width = out.height = 256;
  const ctx = out.getContext('2d');
  // Output = the 240 px circle area scaled to 256 px. Re-encoding drops EXIF (incl. GPS).
  ctx.save(); ctx.translate(-(300 - 240) / 2 * (256 / 240), -(300 - 240) / 2 * (256 / 240)); paint(ctx, 300 * (256 / 240), 256 / 240); ctx.restore();
  const done = (blob) => {
    const r = new FileReader();
    r.onload = () => { S.photo = r.result; S.photoKB = Math.max(1, Math.round(blob.size / 1024)); S.crop = null;
      toast(S.cond === 'offline' ? `Αποθηκεύτηκε (${S.photoKB} KB). Ανεβαίνει όταν βρεθεί ίντερνετ.` : `Η φωτογραφία αποθηκεύτηκε · ${S.photoKB} KB`); };
    r.readAsDataURL(blob);
  };
  out.toBlob((b) => { if (b && b.type === 'image/webp') done(b); else out.toBlob((j) => done(j), 'image/jpeg', 0.8); }, 'image/webp', 0.8);
}
function sampleImage() {
  // A fictional seascape with a sail, no person.
  const c = document.createElement('canvas'); c.width = 1200; c.height = 900; const x = c.getContext('2d');
  let g = x.createLinearGradient(0, 0, 0, 520); g.addColorStop(0, '#7dd3fc'); g.addColorStop(1, '#e0f2fe'); x.fillStyle = g; x.fillRect(0, 0, 1200, 520);
  g = x.createLinearGradient(0, 520, 0, 900); g.addColorStop(0, '#0e7490'); g.addColorStop(1, '#083344'); x.fillStyle = g; x.fillRect(0, 520, 1200, 380);
  x.fillStyle = '#fde68a'; x.beginPath(); x.arc(930, 170, 70, 0, 7); x.fill();
  x.fillStyle = '#9ca3af'; x.beginPath(); x.moveTo(0, 520); x.lineTo(180, 450); x.lineTo(330, 500); x.lineTo(420, 470); x.lineTo(560, 520); x.fill();
  x.fillStyle = '#fff'; x.beginPath(); x.moveTo(600, 170); x.lineTo(600, 560); x.lineTo(420, 560); x.fill();
  x.fillStyle = '#f97316'; x.beginPath(); x.moveTo(612, 220); x.lineTo(760, 560); x.lineTo(612, 560); x.fill();
  x.fillStyle = '#111827'; x.beginPath(); x.moveTo(380, 575); x.lineTo(800, 575); x.lineTo(740, 625); x.lineTo(430, 625); x.fill();
  x.strokeStyle = 'rgba(255,255,255,.5)'; x.lineWidth = 6; for (let i = 0; i < 6; i++) { x.beginPath(); x.moveTo(80 + i * 190, 700 + (i % 2) * 60); x.quadraticCurveTo(140 + i * 190, 680 + (i % 2) * 60, 200 + i * 190, 700 + (i % 2) * 60); x.stroke(); }
  const img = new Image(); img.onload = () => startCrop(img); img.src = c.toDataURL('image/jpeg', 0.9);
}
function pickFile(capture) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; if (capture) inp.capture = 'user';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const url = URL.createObjectURL(f); const img = new Image();
    img.onload = () => startCrop(img);
    img.onerror = () => toast('Δεν διαβάζεται αυτή η εικόνα. Δοκίμασε JPG ή PNG.');
    img.src = url;
  };
  inp.click();
}

let snackTimer;
function toast(t, undo) {
  S.snack = { t, undo }; render();
  clearTimeout(snackTimer); snackTimer = setTimeout(() => { S.snack = null; render(); }, undo ? 6000 : 3500);
}

/* ---------------- Events ---------------- */
document.addEventListener('click', (e) => {
  const c = e.target.closest('[data-ctl]');
  if (c) { const k = c.dataset.ctl; S[k] = k === 'width' ? Number(c.dataset.v) : c.dataset.v; if (k === 'screen') { S.sheet = null; S.crop = null; } render(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const v = a.dataset.v;
  switch (a.dataset.act) {
    case 'go': S.screen = v; S.sheet = null; render(); break;
    case 'nav': if (v === 'home') { S.screen = 'home'; render(); } else if (v === 'live') { S.screen = 'live'; render(); } break;
    case 'sheet': S.sheet = v; S.snack = null; if (v === 'avatar') { S.draft = { ...S.avatar }; S.avTab = S.photo ? 'photo' : 'badge'; } render(); break;
    case 'scrim': if (e.target === a) { S.sheet = null; render(); } break;
    case 'close': S.sheet = null; render(); break;
    case 'avtab': S.avTab = v; render(); break;
    case 'pickg': S.draft.kind = v; render(); break;
    case 'pickc': S.draft.color = v; render(); break;
    case 'savebadge': { const hadPhoto = !!S.photo; const prev = { avatar: S.avatar, photo: S.photo, kb: S.photoKB };
      S.avatar = { ...S.draft }; S.photo = null; S.sheet = null; window._undo = prev;
      toast(hadPhoto ? 'Το σήμα αποθηκεύτηκε, η φωτογραφία σβήστηκε' : 'Το σήμα αποθηκεύτηκε', hadPhoto); break; }
    case 'pickfile': pickFile(false); break;
    case 'pickcam': pickFile(true); break;
    case 'sample': sampleImage(); break;
    case 'rmphoto': window._undo = { avatar: S.avatar, photo: S.photo, kb: S.photoKB }; S.photo = null; S.sheet = null; toast('Η φωτογραφία αφαιρέθηκε', true); break;
    case 'undo': if (window._undo) { S.avatar = window._undo.avatar; S.photo = window._undo.photo; S.photoKB = window._undo.kb; } S.snack = null; render(); break;
    case 'savename': { const inp = document.querySelector('[data-in="name"]'); const n = inp.value.trim();
      if (n.length < 2) { inp.closest('.fl').classList.add('err'); inp.nextElementSibling.textContent = '! Γράψε τουλάχιστον 2 χαρακτήρες.'; return; }
      S.name = n; S.sheet = null; toast('Το όνομα άλλαξε'); break; }
    case 'cropcancel': S.crop = null; render(); break;
    case 'cropok': if (!S.crop.busy) finishCrop(); break;
    case 'rot': S.crop.rot = (S.crop.rot + 90) % 360; S.crop.ox = S.crop.oy = 0; drawCrop(); break;
    case 'zoom': S.crop.scale = Math.max(1, Math.min(3, S.crop.scale + Number(v) * 0.25)); const r = document.querySelector('[data-in="zoom"]'); if (r) r.value = S.crop.scale; drawCrop(); break;
    case 'tgl': a.classList.toggle('on'); break;
  }
});
document.addEventListener('input', (e) => {
  const k = e.target.dataset.in;
  if (k === 'zoom') { S.crop.scale = Number(e.target.value); drawCrop(); }
  if (k === 'sailno') { S.draft.sailno = e.target.value.replace(/[^0-9A-Za-z]/g, '').toUpperCase().slice(0, 5); const pv = document.querySelector('.sheet > div[style*="text-align:center"]'); if (pv) pv.innerHTML = avatarHTML(96, S.draft, false); }
});
let drag = null;
document.addEventListener('pointerdown', (e) => { const ar = e.target.closest('[data-crop]'); if (!ar || !S.crop) return; drag = { x: e.clientX, y: e.clientY, ox: S.crop.ox, oy: S.crop.oy }; ar.setPointerCapture(e.pointerId); });
document.addEventListener('pointermove', (e) => { if (!drag) return; S.crop.ox = drag.ox + e.clientX - drag.x; S.crop.oy = drag.oy + e.clientY - drag.y; drawCrop(); });
document.addEventListener('pointerup', () => (drag = null));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (S.sheet || S.crop)) { S.sheet = null; S.crop = null; render(); } });

/* Live numbers tick without re-rendering the page (no animation on values). */
let t0 = 4360;
setInterval(() => {
  if (S.screen !== 'live' || S.ver === 'old' || S.cond === 'nogps') return;
  t0++; const bsp = 6.6 + Math.random() * 0.5, pct = Math.round((bsp / 7.1) * 100);
  const f = (n) => n.toFixed(1).replace('.', ',');
  const set = (k, v) => document.querySelectorAll(`[data-k="${k}"]`).forEach((el) => (el.textContent = v));
  set('bsp', f(bsp)); set('pct', pct + '%'); set('twa', Math.round(40 + Math.random() * 5) + '°'); set('hdg', Math.round(203 + Math.random() * 5) + '°');
  set('clock', [Math.floor(t0 / 3600), Math.floor((t0 % 3600) / 60), t0 % 60].map((n) => String(n).padStart(2, '0')).join(':'));
  document.querySelectorAll('[data-k="pctbar"]').forEach((el) => (el.style.width = Math.min(100, pct) + '%'));
}, 1500);

/* Deep links, e.g. #screen=profile&theme=all&width=320&size=xl&sheet=avatar */
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => {
  if (k === 'width') S.width = Number(v);
  else if (k === 'sheet') { S.sheet = v; S.draft = { ...S.avatar }; }
  else if (k in S && k !== 'crop') S[k] = v;
});
render();
if (location.hash.includes('crop=1')) sampleImage();
</script>
</body>
</html>
