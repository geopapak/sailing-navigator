  .seg { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); background:var(--surface-2); border-radius:var(--r-m); padding:4px; gap:4px; margin-top:6px; }
  .seg button { min-height:var(--hit); border:0; border-radius:11px; background:none; font-weight:800; color:var(--muted); padding:0 6px; }
  .seg button.on { background:var(--bg); color:var(--fg); box-shadow:var(--shadow-1); }
  .phone[data-theme='dark'] .seg button.on { background:var(--accent-cont); color:var(--on-accent-cont); }
  .phone[data-theme='night'] .seg button.on { background:#000; border:2px solid var(--fg); color:var(--fg); }
  .stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--s2); margin-top:var(--s2); }

  .stats .wide2 { grid-column:1 / -1; }
  .faded { opacity:.45; }
  .stp { display:grid; grid-template-columns:var(--hit) minmax(0,1fr) var(--hit); gap:6px; align-items:center; margin-top:6px; }

  .stp output { text-align:center; font-weight:900; font-size:1.3em; font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* ---------- Frame 4 · Sign-in with invite (§Δ) ---------- */
  .auth { max-width:26em; margin:0 auto; padding:var(--s2) 0 var(--s4); }

<body>
<div class="controls" role="toolbar" aria-label="Επιλογές σκίτσου">
  <div class="grp"><label>Καρέ</label><div class="pick" data-k="frame"></div></div>
  <div class="grp"><label>Κατάσταση</label><div class="pick" data-k="st"></div></div>
  <div class="grp"><label>Έκδοση</label><div class="pick" data-k="ver"></div></div>
  <div class="grp"><label>Θέμα</label><div class="pick" data-k="theme"></div></div>
  <div class="grp"><label>Γράμματα</label><div class="pick" data-k="size"></div></div>
</div>
<div class="page">
  <div class="phones" id="phones"></div>

</div>

<script>
/* ======================= Data & state ======================= */
const FRAMES = {
  1:{ l:'1 · Live αγώνα: μπάρα', st:[['run','Σε εξέλιξη'],['band','Με ζώνη ειδοποίησης']] },
  2:{ l:'2 · Βέλτιστη διαδρομή', st:[
      ['none','Χωρίς πρόγνωση'],['loading','Λήψη…'],['ok','Πρόγνωση έτοιμη'],['done','Υπολογίστηκε'],['refreshed','Ανανεώθηκε'],
      ['stale','Άλλαξε η ώρα'],['partial','Εν μέρει κάλυψη'],['past','Εκκίνηση πέρασε'],['dateonly','Χωρίς ώρα'],
      ['horizon','Πέρα από τον ορίζοντα'],['offok','Offline, καλύπτει'],['offline','Offline, δεν φτάνει'],['missing','Λείπουν στοιχεία'],['error','Σφάλμα υπολογισμού']] },
  3:{ l:'3 · Ημερομηνία & ώρα', st:[['filled','Συμπληρωμένα'],['empty','Κενά'],['baddate','Λάθος ημερομηνία'],['badtime','Λάθος ώρα']] },
  4:{ l:'4 · Πρόσκληση', st:[['login','Σύνδεση'],['signup','Εγγραφή (πρώτη φορά)'],['offline','Χωρίς ίντερνετ'],['e404','Δεν βρέθηκε (404)'],['e410a','Έληξε (410)'],['e410b','Χρησιμοποιήθηκε (410)'],['enet','Σφάλμα δικτύου'],['slow','Αργεί']] },
};
const S = { frame:'1', st:{ 1:'run', 2:'ok', 3:'filled', 4:'login' }, ver:'new', theme:'day', size:'n', view2:'form', wind2:'forecast' };
let PHONES = [[375, 812], [320, 568]];
const phonesFor = (f) => (f === '1' ? [[390, 844], ...PHONES] : PHONES); // §Ι is specified at 390×844 (ΚΑ-Ι2)

/* ======================= Icons (stroke, currentColor) ======================= */
const P = {
  back:'<path d="M15 5l-7 7 7 7"/>', cloud:'<path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"/>',
  route:'<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"/>',
  warn:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>', off:'<path d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 4-2.5M19 13a10 10 0 0 0-3-2M2 9.5a15 15 0 0 1 4.5-3M22 9.5A15 15 0 0 0 11 5.1"/><path d="M12 20h.01"/>',
  check:'<path d="M5 12l5 5 9-10"/>', crew:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M16 4.5a3 3 0 0 1 0 6M18 14c2 .8 3 3 3 6"/>',
  live:'<path d="M3 12h4l3-7 4 14 3-7h4"/>', map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>', chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  home:'<path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/>', history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>', boats:'<path d="M12 3v13H5zM14 6l6 10h-6z"/><path d="M3 19h18l-2 2H5z"/>', gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  mute:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/>', pen:'<path d="M4 20l4-1 11-11-3-3L5 16z"/>', stop:'<rect x="6" y="6" width="12" height="12" rx="1.5"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', logo:'<path d="M12 3v15M12 3l7 13H12M12 6 6 16h6M4 19h16l-2 2H6z"/>',
};
const icon = (n, cls = 'ic') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const NAV_OUT = [['home','Αρχική','home'],['history','Ιστορικό','history'],['boats','Σκάφη','boats'],['settings','Ρυθμίσεις','gear']];
const NAV_IN = [['live','Live','live'],['map','Χάρτης','map'],['chat','Σύμβουλος','chat']];
const nav = (items, on) => `<nav class="nav" style="--n:${items.length}" aria-label="${items === NAV_IN ? 'Οθόνες εξόδου' : 'Κύριες οθόνες'}">${items.map(([id, l, ic]) => `<button class="${id === on ? 'on' : ''}" ${id === on ? 'aria-current="page"' : ''}><span class="pill">${icon(ic)}</span><span>${l}</span></button>`).join('')}</nav>`;
const strip = (t) => `<div class="strip" role="status"><span class="d" aria-hidden="true"></span><span>${t}</span></div>`;
const topBar = (title, back = true) => `<header class="top">${back ? `<button class="iconbtn" aria-label="Πίσω">${icon('back')}</button>` : ''}<span class="ttl">${title}</span></header>`;

/* ======================= Frame 1 · Race Live bar (§Ι) ======================= */
function frame1(w) {
  const band = S.st[1] === 'band';
  const old = S.ver === 'old';
  const bar = (cls) => `<div class="ract ${cls}" data-bar role="group" aria-label="Ενέργειες αγώνα"><button class="b out main">Θέση αντιπάλου</button><button class="b fill main">Τερματισμός</button></div>`;
  const rs = `<section class="c" data-rs aria-label="Οθόνη αγώνα">
    ${band
      ? `<div class="band" role="alert" data-num="ζώνη">${icon('warn')}<span class="big">Επόμενο: αναστροφή στη layline δεξιών σε 6′48″</span><button class="mute" aria-label="Σίγαση ειδοποιήσεων για 5 λεπτά">${icon('mute')}<span>5′</span></button></div>`
      : `<div class="rs-top" data-rstop><h3>Οθόνη αγώνα</h3><button class="b out sm">${icon('mute')} Σίγαση 5′</button></div>`}
    <div class="rs-tile"><span><span class="lab">Ταχύτητα</span><span class="ab">BSP · kt</span><span class="sub good">στόχος 7,1 · 96%</span></span><span class="val" data-num="Ταχύτητα">6,8</span></div>
    <div class="rs-tile"><span><span class="lab">Γωνία ανέμου</span><span class="ab">TWA · δεξιές μούρες</span><span class="sub">στόχος 42°</span></span><span class="val stbd" data-num="Γωνία ανέμου">41°</span></div>
    <div class="rs-tile"><span><span class="lab">Επόμενη</span><span class="ab">αναστροφή (τακ)</span><span class="sub">1,2 NM · layline δεξιών</span></span><span class="val" data-num="Επόμενη" aria-label="σε 6 λεπτά και 48 δευτερόλεπτα"><span class="pre">σε</span>6′48″</span></div>
    <button class="wind" data-num="Άνεμος" aria-label="Άνεμος: TWS 14 kt, TWD 225°T, από τα όργανα. Αλλαγή"><span><span class="wk">Άνεμος <span>· TWS · TWD</span></span><span class="wv">14<small> kt</small> · 225°<small>T</small></span></span><span class="wgo">${icon('pen')}Αλλαγή</span></button>
    <div class="rs-next" data-num="Σημαδούρα"><span>Ψυττάλεια · 1,4 NM · 218°T</span><span>σε 11′20″</span></div>
    <div class="rs-next" data-num="Κατάταξη" data-fit-end><span>Κατάταξη (εκτ.)</span><span>2ος · −0:48</span></div>
    <p class="cap2" style="margin:8px 0 0">Ενδεικτικό, όχι για ναυσιπλοΐα. Οι ειδοποιήσεις είναι προτάσεις και ακούγονται μόνο με την οθόνη ανοιχτή. Η απόφαση είναι του κυβερνήτη.</p>
  </section>`;
  const rest = `<section class="c"><h3>Κατάταξη σε διορθωμένο</h3>
      <div class="rkrow"><span class="num">1</span><b>Αύρα</b><span class="num">+0:48</span></div>
      <div class="rkrow own"><span class="num">2</span><b>Ναυτίλος (εμείς)</b><span class="num">—</span></div>
      <div class="rkrow"><span class="num">3</span><b>Ζέφυρος</b><span class="num">−2:15</span></div>
      <p class="cap2" style="margin:6px 0 0">Εκτίμηση από AIS πριν από 2′ και τα polars κάθε σκάφους.</p></section>
    <p class="recl"><span class="rec" aria-hidden="true"></span>Καταγραφή αγώνα σε εξέλιξη · 1.284 σημεία</p>`;
  // New: the bar is rendered after the race screen; layout() moves it to the end and makes it sticky when it fits.
  const body = old ? `${rs}${rest}${bar('old')}` : `${rs}${bar('flow')}${rest}`;
  return `${`<header class="sbar"><div class="modeb"><b><span class="rec" aria-hidden="true"></span>ΑΓΩΝΑΣ</b><span class="clk num">01:12:40</span><span class="s">σε εξέλιξη · Χειμερινό Σαρωνικού · 3η</span></div><button class="sb" aria-label="Γρήγορες ρυθμίσεις">${icon('gear')}</button><button class="sb" style="min-width:84px">${icon('stop')} Τέλος</button></header>`}
    <div class="scr ${old ? 'endbar' : ''}" data-scr>${body}</div>${nav(NAV_IN, 'live')}`;
}
/* Fit rule (§Ι): the whole race screen (to the last .rs-next) + a reserved alert band + the bar fit in the scroll area → sticky. */
function layout1(ph) {
  const scr = ph.querySelector('[data-scr]'), bar = ph.querySelector('[data-bar]'), rs = ph.querySelector('[data-rs]');
  if (!scr || !bar) return;
  const em = parseFloat(getComputedStyle(ph).fontSize);
  let mode = 'old';
  if (bar.classList.contains('flow')) {
    const end = rs.querySelector('[data-fit-end]').getBoundingClientRect().bottom - scr.getBoundingClientRect().top + scr.scrollTop;
    // The alert band takes the place of the «Οθόνη αγώνα» header row (it has its own mute button), so only the difference is reserved.
    const head = rs.querySelector('[data-rstop]');
    const reserve = head ? Math.max(0, 4.8 * em + 12 - head.offsetHeight) : 0;
    const need = end + reserve + bar.offsetHeight + 12;
    const btns = bar.querySelectorAll('.b');
    const oneRow = btns[0].offsetTop === btns[1].offsetTop;
    if (oneRow && need <= scr.clientHeight) { bar.classList.replace('flow', 'stick'); scr.appendChild(bar); scr.classList.add('endbar'); mode = 'stick'; }
    else mode = 'flow';
    ph.dataset.need = Math.round(need); ph.dataset.avail = scr.clientHeight;
  }
  ph.dataset.mode = mode;
  const check = () => {
    const br = bar.getBoundingClientRect(), sr = scr.getBoundingClientRect();
    const hit = [];
    ph.querySelectorAll('[data-num]').forEach((el) => {
      const r = el.getBoundingClientRect();
      const vis = r.bottom > sr.top && r.top < sr.bottom;
      const over = vis && br.top < sr.bottom && r.bottom > br.top + 1 && r.top < br.bottom - 1;
      el.classList.toggle('hit-bad', over);
      if (over) hit.push(el.dataset.num);
    });
    const cap = document.getElementById('chk-' + ph.dataset.w);
    if (cap) {
      const m = mode === 'stick' ? 'σταθερή (χωράει)' : mode === 'flow' ? 'μέσα στη ροή (δεν χωράει)' : 'σταθερή, 2 σειρές (0.19.0)';
      cap.className = 'chk ' + (hit.length ? 'bad' : 'ok');
      cap.textContent = `Μπάρα: ${m} · ύψος ${bar.offsetHeight} px · ${hit.length ? 'σκεπάζει: ' + hit.join(', ') : 'δεν σκεπάζει νούμερα'}`;
    }
  };
  scr.addEventListener('scroll', check, { passive:true });
  check();
}

/* Forms (§Ι, ΚΑ-Ι4): the bar is sticky when its two buttons fit in one row, else it stays at the end, in the flow. */
function layoutForm(ph) {
  const bar = ph.querySelector('[data-form]'); if (!bar) return;
  const btns = bar.querySelectorAll('.b');
  if (btns[0].offsetTop === btns[1].offsetTop) { bar.classList.replace('end', 'stick'); ph.querySelector('[data-scr]').classList.add('endbar'); }
}

/* ======================= Frame 2 · «Βέλτιστη διαδρομή» (§Λ, §Μ) ======================= */
const RACE = 'Χειμερινό Σαρωνικού · 3η';
const OK_LABEL = 'Πρόγνωση για Σάβ 23/11 11:00 · Αυτόματο (best match) · λήψη Τετ 20/11 14:05';
const ST2 = {
  none:{ label:[['Δεν υπάρχει πρόγνωση για τον αγώνα ακόμα.', 'info', 'cloud']], fetch:'Λήψη πρόγνωσης' },
  loading:{ label:[['Λήψη…', 'info', 'cloud']], fetch:'Λήψη…', busy:true },
  ok:{ label:[[OK_LABEL, 'info', 'cloud']] },
  done:{ label:[[OK_LABEL, 'info', 'cloud']], calc:'Υπολογίστηκε Τετ 20/11 14:20 · 2 ώ 05′ · 9,8 NM', route:'fresh' },
  refreshed:{ label:[['Ανανεώθηκε η πρόγνωση (λήψη Σάβ 23/11 08:10)', 'good', 'check']], calc:'Υπολογίστηκε με πρόγνωση της Τετ 20/11 14:05', recalc:true, route:'fresh' },
  stale:{ label:[[OK_LABEL, 'info', 'cloud']], calc:'Η διαδρομή υπολογίστηκε για άλλη ώρα ή διαδρομή', recalc:true, route:'stale', start:['23/11/2026', '12:30'] },
  partial:{ label:[['Πρόγνωση για Σάβ 23/11 20:00 · Météo-France ARPEGE (10 km) · λήψη Τετ 20/11 14:05', 'info', 'cloud']], start:['23/11/2026', '20:00'], route:'fresh', note:'Η πρόγνωση τελειώνει στις Κυρ 24/11 02:00· μετά κρατάμε τον άνεμο της τελευταίας ώρας.', res:['6 ώ 40′', '02:40', '9,4 NM', '10,6 NM'] },
  past:{ label:[['Η ώρα εκκίνησης πέρασε (Τετ 20/11 11:00). Άλλαξέ την αν μετατέθηκε.', 'warn', 'warn']], start:['20/11/2026', '11:00'], route:'fresh' },
  dateonly:{ label:[['Πρόγνωση για Σάβ 23/11 (χωρίς ώρα)', 'info', 'cloud']], start:['23/11/2026', ''], miss:['Βάλε ώρα εκκίνησης.'], noCalc:'Βάλε ώρα εκκίνησης για τη βέλτιστη διαδρομή.' },
  horizon:{ label:[['Η πρόγνωση φτάνει ως Πέμ 05/12. Ο αγώνας είναι Τρι 10/12 11:00: δοκίμασε ξανά από Σάβ 07/12, ή διάλεξε «Σταθερός» άνεμο.', 'warn', 'warn']], start:['10/12/2026', '11:00'], fetch:'Λήψη πρόγνωσης', horizon:true },
  offok:{ label:[[OK_LABEL + ' (χωρίς ίντερνετ)', 'info', 'off']], offline:true },
  offline:{ label:[['Χωρίς ίντερνετ, και η αποθηκευμένη πρόγνωση (λήψη Τετ 20/11 14:05) δεν φτάνει ως τον αγώνα.', 'warn', 'off']], offline:true, horizon:true },
  missing:{ label:[['Δεν υπάρχει πρόγνωση για τον αγώνα ακόμα.', 'info', 'cloud']], fetch:'Λήψη πρόγνωσης', miss:['Λείπει διαδρομή με τουλάχιστον 2 σημεία.', 'Βάλε ώρα εκκίνησης.', 'Η βέλτιστη διαδρομή θέλει polars του σκάφους (από το πιστοποιητικό ORC ή με το χέρι).'], start:['', ''], nocourse:true },
  error:{ label:[[OK_LABEL, 'info', 'cloud']], err:true },
};
const fcLine = ([t, k, ic]) => `<div class="fc ${k === 'info' ? '' : k}" data-testid="forecast-label" role="status">${icon(ic)}<span>${t}</span></div>`;
function dtf(id, d, t, opt = {}) {
  const errD = opt.errD ? `<span class="ferr" id="${id}-de">Γράψε ημερομηνία όπως 23/11/2026</span>` : '';
  const errT = opt.errT ? `<span class="ferr" id="${id}-te">Γράψε ώρα όπως 11:00</span>` : '';
  return `<div class="fl" role="group" aria-labelledby="${id}-l"><span id="${id}-l">${opt.label || 'Εκκίνηση'}</span>
    <div class="dtf" data-dtf>

    <h3>Απόφαση UX</h3><ul><li>Η ζώνη ειδοποίησης μπαίνει <b>στη θέση</b> της γραμμής «Οθόνη αγώνα · Σίγαση 5′», αφού έχει δικό της κουμπί σίγασης «5′». Έτσι το ύψος μεγαλώνει μόνο κατά ~30 px. Αυτή τη διαφορά την κρατάμε από πριν. Έτσι η μπάρα δεν αλλάζει θέση τη στιγμή που βγαίνει «layline σε 2′», δηλαδή όταν ο τακτικός πάει να πατήσει. Η απόφαση ξαναγίνεται μόνο όταν αλλάξει το μέγεθος γραμμάτων, ο προσανατολισμός ή το ύψος της οθόνης (<code>ResizeObserver</code>, σε em, όπως το <code>useNavMode</code>).</li>
    <li>Όταν είναι σταθερή, η μπάρα μπαίνει στο τέλος της σελίδας με <code>sticky; bottom:0</code>. Έτσι το τελευταίο στοιχείο ανεβαίνει πάντα πάνω της (ΚΑ-Ι3). Όταν είναι μέσα στη ροή, μπαίνει αμέσως μετά την «Οθόνη αγώνα». Είναι το ίδιο συστατικό σε δύο θέσεις, και η σειρά του Tab ακολουθεί αυτό που φαίνεται.</li>
    <li>Η μπάρα γίνεται σταθερή μόνο αν τα δύο κουμπιά χωράνε σε <b>μία σειρά</b>. Όταν είναι μέσα στη ροή και μια λέξη δεν χωράει («Πολύ μεγάλα», 320 px), τα κουμπιά μπαίνουν το ένα κάτω από το άλλο. Λέξη κομμένη στη μέση δεν βγαίνει ποτέ.</li>
    <li>Το ίδιο ισχύει στις φόρμες («Αποθήκευση για αργότερα / Αποθήκευση και έναρξη», καρέ 2): είναι σταθερή όταν χωράει σε μία σειρά, αλλιώς μένει στο τέλος της φόρμας.</li></ul>
    <h3>Μένει ίδιο</h3><ul><li>Κείμενα, χρώματα και ενέργειες των κουμπιών. Φόντο <code>var(--bg)</code>. Στη Νύχτα κόκκινο <code>#ff3b30</code> σε μαύρο.</li></ul>`,
  2:`<h2>2 · «Βέλτιστη διαδρομή» στην προετοιμασία (§Λ, §Μ)</h2>
    <p><span class="tag">νέο</span>Κάρτα κάτω από «Εκκίνηση» και «Βαθμολογία». Έχει την ετικέτα πρόγνωσης, το «Λήψη / Ανανέωση πρόγνωσης» και το «Δες τη βέλτιστη διαδρομή», που είναι το κύριο κουμπί της κάρτας. Πάτα το: ανοίγει ο Χάρτης σε λειτουργία προετοιμασίας, με «← Αγώνας» για επιστροφή.</p>
    <ul><li>Στον Χάρτη η ετικέτα πρόγνωσης είναι <b>στην κεφαλίδα</b>, κάτω από τον τίτλο, και φαίνεται χωρίς κύλιση. Ο τίτλος πιάνει το πολύ 2 γραμμές και μετά κόβεται με «…».</li>
    <li>Δεν υπάρχει πεδίο ώρας. Τα σημεία φαίνονται ως λίστα χωρίς κουμπιά επεξεργασίας.</li>
    <li>Το κουμπί υπολογισμού είναι μέσα στη ροή, πάνω από το «Αποτέλεσμα», άρα δεν το σκεπάζει (ΚΑ-Μ6).</li>
    <li>Στην κατάσταση «Πέρα από τον ορίζοντα» άλλαξε στον Χάρτη σε «Σταθερός»: ο υπολογισμός ανοίγει.</li></ul>
    <p><span class="tag same">ίδιο</span>Μοντέλο, «Σταθερός», ρυθμίσεις υπολογισμού, «Αποτέλεσμα». Η φόρμα κρατά ό,τι γράφτηκε (υπο-οθόνη όπως ο <code>CourseEditor</code>).</p>
    <p class="muted">Τα κείμενα είναι αυτούσια από τα ΚΑ-Λ1…Λ11 και ΚΑ-Μ2/Μ4. Ο χάρτης είναι σκίτσο, ενδεικτικό, όχι για ναυσιπλοΐα.</p>`,
  3:`<h2>3 · DateTimeField (§Κ)</h2>
    <p><span class="tag">νέο</span>Δύο πεδία κειμένου, «ηη/μμ/εεεε» και «ΩΩ:ΛΛ», με <code>inputmode="numeric"</code>. Σε κάθε browser η μορφή είναι ίδια: πάντα μέρα/μήνας και 24ωρο. Στα 320 px με «Πολύ μεγάλα» η ώρα πάει κάτω από την ημερομηνία (flex-wrap) αντί να στενέψει.</p>
    <h3>Συμπεριφορά (αποφάσεις UX)</h3><ul>
    <li>Γράφεις μόνο ψηφία και οι «/» και «:» μπαίνουν μόνα τους. Δεκτά είναι και «23.11.2026», «23-11-26» και «9» ή «9.30» για ώρα. Όταν φεύγεις από το πεδίο, γίνεται 23/11/2026 και 09:30.</li>
    <li>Ο έλεγχος γίνεται όταν φεύγεις από το πεδίο, όχι ενώ γράφεις. Το λάθος φαίνεται με παχύ περίγραμμα και με «!» μπροστά στο μήνυμα, ώστε να διαβάζεται και στη Νύχτα χωρίς χρώμα.</li>
    <li>Ένα κενό πεδίο δίνει <code>undefined</code>, ποτέ «τώρα». Ημερομηνία χωρίς ώρα επιτρέπεται (ΚΑ-Λ8).</li>
    <li>Το «Λήξη πιστοποιητικού» είναι <code>DateField</code>, μόνο με ημερομηνία.</li></ul>
    <p>a11y: <code>role="group"</code> με την ετικέτα του πεδίου. Κάθε πεδίο έχει <code>aria-label</code> «Εκκίνηση, ημερομηνία» ή «Εκκίνηση, ώρα». Σε λάθος: <code>aria-invalid</code> και <code>aria-describedby</code> προς το μήνυμα.</p>`,
  4:`<h2>4 · Πρόσκληση πριν από τη σύνδεση (§Δ)</h2>
    <p><span class="tag">νέο</span>Πλαίσιο <code>data-testid="invite-hint"</code> πάνω από το «Email / Κωδικός», χωρίς όνομα σκάφους (Π4). Χρησιμοποιεί τα tokens <code>--accent-cont</code> και <code>--accent</code>, και στη Νύχτα μαύρο με κόκκινο περίγραμμα 3 px.</p>
    <ul><li>Με πρόσκληση το λογότυπο γίνεται μία γραμμή χωρίς υπότιτλο, ώστε στα 320×568 με «Κανονικά» να φαίνονται πλαίσιο, Email και Κωδικός χωρίς κύλιση.</li>
    <li>Ανοίγει στην «Εγγραφή» αν η συσκευή δεν είχε ποτέ λογαριασμό, αλλιώς στη «Σύνδεση». Το «Νέος λογαριασμός» ή το «Έχεις λογαριασμό; Σύνδεση» φαίνεται πάντα.</li>
    <li>Οθόνες σφάλματος: δική τους σελίδα «Πρόσκληση στο πλήρωμα», με τα κουμπιά χαμηλά για το ένα χέρι. «Ξανά» υπάρχει μόνο σε σφάλμα δικτύου και όταν αργεί. Το «Στην αρχική» υπάρχει πάντα.</li></ul>
    <p><span class="tag ask">ερώτημα</span>Το κείμενο της λωρίδας «Χωρίς ίντερνετ» στη σύνδεση είναι νέο. Δες το ερώτημα 1 στο <code>NOTES.md</code>.</p>`,
};

/* ======================= Render ======================= */
function picks() {
  const opts = {
    frame:Object.entries(FRAMES).map(([k, f]) => [k, f.l]),
    st:FRAMES[S.frame].st,
    ver:[['old','Σημερινό (0.19.0)'],['new','Νέο (0.19.1)']],
    theme:[['day','Μέρα'],['dark','Σούρουπο'],['night','Νύχτα']],
    size:[['n','Κανονικά'],['l','Μεγάλα'],['xl','Πολύ μεγάλα']],
  };
  document.querySelectorAll('.pick').forEach((p) => {
    const k = p.dataset.k, cur = k === 'st' ? S.st[S.frame] : S[k];
    p.innerHTML = opts[k].map(([v, l]) => `<button data-v="${v}" class="${v === cur ? 'on' : ''}" aria-pressed="${v === cur}">${l}</button>`).join('');
  });
}
function render() {
  picks();
  const fn = { 1:frame1, 2:frame2, 3:frame3, 4:frame4 }[S.frame];
  document.getElementById('phones').innerHTML = phonesFor(S.frame).map(([w, h]) => `<div class="fw">
      <div class="phone fr-${w} sz-${S.size}" data-theme="${S.theme}" data-w="${w}" style="width:${w}px;height:${h}px"><div class="shell">${fn(w)}</div></div>
      <p class="cap">${w} × ${h} · ${FRAMES[S.frame].l.slice(4)}<span class="chk" id="chk-${w}"></span></p></div>`).join('');
  document.getElementById('notes').innerHTML = NOTES[S.frame] + `<h3>Πώς το βλέπεις</h3><p class="muted">Ζωντανό: <code>python -m http.server 8086 --bind 127.0.0.1 --directory design/fixes-0.19.1</code> και άνοιγμα του http://127.0.0.1:8086/ · Σημειώσεις και ερωτήματα: <code>NOTES.md</code>.</p>`;
  document.querySelectorAll('.phone').forEach((ph) => {
    if (S.frame === '1') layout1(ph);
    if (S.frame === '2') layoutForm(ph);
    if (S.frame === '3' || S.frame === '2') wireDtf(ph);
    const scr = ph.querySelector('[data-scr]');
    const cap = document.getElementById('chk-' + ph.dataset.w);
    if (S.frame !== '1' && cap && scr) { const ow = scr.scrollWidth > scr.clientWidth; cap.className = 'chk ' + (ow ? 'bad' : 'ok'); cap.textContent = ow ? 'Οριζόντια υπερχείλιση!' : 'Χωρίς οριζόντια υπερχείλιση'; }
  });
}
document.querySelector('.controls').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-v]'); if (!b) return;
  const k = b.closest('.pick').dataset.k;
  if (k === 'st') S.st[S.frame] = b.dataset.v; else S[k] = b.dataset.v;
  if (k === 'frame' || k === 'st') S.view2 = S.view2;
  render();
});
document.getElementById('phones').addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]'); if (go && !go.disabled) { S.view2 = go.dataset.go; render(); return; }
  const wb = e.target.closest('[data-wind]'); if (wb) { S.wind2 = wb.dataset.wind; render(); }
});
render();
</script>
</body>
</html>
