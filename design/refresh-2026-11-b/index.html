function av(id, px, opt = {}) {

const BOATS7 = ['Αύρα του Σαρωνικού','Θέτις','Ζέφυρος','Μελτέμι του Σαρωνικού','Γαλήνη','Αλκυόνη','Ναυσικά'];
const RES = { // place per race (8 = DNF/DNC for a class of 7)
  'Αύρα του Σαρωνικού':[1,2,4,1,3,2], 'Θέτις':[3,1,2,5,1,1], 'Ζέφυρος':[2,4,1,2,5,4], 'Μελτέμι του Σαρωνικού':[4,3,3,3,2,6],
  'Γαλήνη':[5,'DNF',6,4,4,3], 'Αλκυόνη':[6,5,5,7,6,5], 'Ναυσικά':[7,6,7,6,7,7],
};
const ptsOf = (v) => (v === 'DNF' || v === 'DNC' ? 8 : v);
function standing(n, discards) {
  return BOATS7.map((b) => {
    const r = RES[b].slice(0, n), p = r.map(ptsOf);
    const worst = discards ? p.indexOf(Math.max(...p)) : -1;
    const total = p.reduce((a, x, i) => a + (i === worst ? 0 : x), 0);
    return { b, r, worst, total, best: Math.min(...p) };
  }).sort((a, z) => a.total - z.total || a.best - z.best);
}
function standTable(n, discards, est) {
  const s = standing(n, discards);
  return `<div class="tw" role="region" aria-label="Γενική κατάταξη" tabindex="0"><table class="stand"><thead><tr><th class="c-pl">#</th><th class="c-boat">σκάφος</th>${Array.from({ length:n }, (_, i) => `<th>${i + 1}η</th>`).join('')}<th class="c-total">σύνολο</th></tr></thead><tbody>
    ${s.map((x, i) => `<tr class="${x.b === 'Θέτις' ? 'own' : ''}"><td class="c-pl">${i + 1}</td><td class="c-boat" title="${x.b}">${x.b === 'Θέτις' ? 'Θέτις · εμείς' : x.b}</td>${x.r.map((v, j) => `<td class="${j === x.worst ? 'disc' : ''}">${j === x.worst ? `(${v === 'DNF' ? 'DNF 8' : v})` : v === 'DNF' ? 'DNF 8' : v}${est && j === n - 1 && x.b === 'Θέτις' ? ' (εκτ.)' : ''}</td>`).join('')}<td class="c-total">${x.total}</td></tr>`).join('')}
  </tbody></table></div>`;
}

  battery:'<b>Φ-E · E11, E20, E21.</b> Μπαταρία στην πρώτη γραμμή της μπάρας: SVG + «64%», αστραπή όταν φορτίζει, υπογράμμιση στο ≤ 20%. Χωρίς API: δεν φαίνεται τίποτα. Στο 20%: λωρίδα μία φορά ανά έξοδο με «Άνοιξε». Η «Χαμηλή κατανάλωση» είναι πρώτη γραμμή στις «Γρήγορες ρυθμίσεις» (ερώτημα 2).',
  lowpower:'<b>Φ-E · E7–E12.</b> Μαύρη οθόνη σε όλα τα θέματα, γράμματα γκρι <code>#8a8a8a</code> (6,1:1) ή κόκκινα <code>#e5483d</code> στη Νύχτα. Άγγιγμα αλλού: τίποτα. Ξεκλείδωμα 76 px: πάτα και κράτα 2″ (ο κύκλος γεμίζει· αφήνεις = μηδενίζει). Enter/Space κρατημένο 2″. Ειδοποίηση: μεγάλο κείμενο με πλαίσιο, χωρίς ξεκλείδωμα. Το «Τερματίσατε;» βγαίνει από πάνω και πατιέται. Μετατόπιση λίγων pixel κάθε 60″ (εδώ: κουμπί «μετατόπιση» με διπλό κλικ στο ρολόι).',
  gaps:'<b>Φ-E · E14–E19.</b> Κενό = ευθεία λεπτή διακεκομμένη <code>2 6</code>, 1,5 px, <code>--muted</code>, με κύκλους στις άκρες και ετικέτα «κενό 6′». Διαφέρει από το ίχνος (3,5 px, συνεχές) και από τη βέλτιστη (<code>4 4</code>) σε σχήμα και πάχος, άρα και στη Νύχτα. Σύνοψη: «Κενά στο ίχνος: 2, συνολικά 14′». Στο γράφημα: κενό χωρίς γραμμή, με γραμμοσκίαση. Ο χάρτης είναι σκίτσο, όχι ναυτικός χάρτης.',
};
function renderNotes() {
  const ctx = frameCtx(S.frame);
  document.getElementById('notes').innerHTML = `
  <h2>Συμπλήρωμα ανανέωσης (Φ-B…Φ-E)</h2>
  <p class="cap2" style="color:#475467">P-049 · πρωτότυπο, όχι αλλαγή στο <code>src/</code>. Φανταστικά ονόματα και σκάφη. Tokens: <code>design/refresh-2026-11/HANDOFF-A.md</code>. Ερωτήματα: <code>NOTES.md</code>.</p>
  <h3>Αυτή η οθόνη</h3><p>${NOTE[S.screen]}</p>
  <h3>Πλαίσιο τώρα</h3><p>${ctx.w}×${ctx.h} με ${ctx.fs} px: πλοήγηση <b>${ctx.side ? 'πλαϊνή' : 'κάτω'}</b>, φύλλο <b>${{ bottom:'από κάτω', center:'στο κέντρο', side:'πλαϊνό πάνελ' }[ctx.mode]}</b>. Οι ίδιοι κανόνες με το <code>sheetMode()</code> σε em της ρύθμισης.</p>
  <h3>Τι μένει ίδιο</h3>
  <ul><li><span class="tag same">ίδιο</span>Ροές, κείμενα της εφαρμογής, <code>data-testid</code>, η σκούρα μπάρα μόνο μέσα στην έξοδο.</li>
  <li><span class="tag same">ίδιο</span>Νύχτα μόνο κόκκινο/μαύρο. Κάθε κατάσταση έχει και κείμενο ή σχήμα.</li>
  <li><span class="tag same">ίδιο</span>Φύλλο «Άνεμος» και αποτελέσματος της P-053/P-040: αλλάζει μόνο το ντύσιμο.</li></ul>
  <h3>Όρια</h3>
  <ul><li>Οι αριθμοί δεν κινούνται. Η κουκκίδα καταγραφής σταματά με reduced motion.</li>
  <li>Ο χάρτης κενών είναι σκίτσο. Στην εφαρμογή μπαίνει στους υπάρχοντες χάρτες (MapLibre, SVG ανάλυσης).</li>
  <li>Η Inter φορτώνει εδώ από unpkg (καρφωμένη έκδοση)· στην εφαρμογή είναι μέσα στο build.</li></ul>
  <p><span class="tag copy">copy</span>Νέα κείμενα που δεν υπάρχουν στο spec τα ελέγχει ο copywriter: γραμμή πρόσκλησης, «Μαύρη οθόνη με κλείδωμα αφής…», «Στο κενό δεν σχεδιάζεται γραμμή…».</p>`;
}

/* ======================= Events ======================= */
document.addEventListener('click', (e) => {
  const c = e.target.closest('[data-ctl]');
  if (c) {
    const k = c.dataset.ctl, v = c.dataset.v;
    if (k === 'screen') { S.screen = v; S.state = null; S.sheetOpen = true; }
    else if (k === 'sheet') S.sheetOpen = v === '1';
    else S[k] = v;
    render(); return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const v = a.dataset.v;
  switch (a.dataset.act) {
    case 'close': S.sheetOpen = false; render(); break;
    case 'scrim': if (e.target === a && !a.classList.contains('confirm')) { S.sheetOpen = false; render(); } break;
    case 'kp': if (v === 'C') S.kp = ''; else if (v === 'B') S.kp = S.kp.slice(0, -1); else if (S.kp.length < (S.kpMode === 'clock' ? 6 : 5)) S.kp += v; render(); break;
    case 'kpm': S.kpMode = v; S.kp = v === 'clock' ? '140732' : v === 'elapsed' ? '30732' : ''; render(); break;
    case 'code': S.code = v; render(); break;
    case 'stats': S.stats = !S.stats; render(); break;
    case 'notice': S.notice = !S.notice; render(); break;
  }
});
document.addEventListener('dblclick', (e) => { if (e.target.closest('.lclk')) { S.lpShift++; render(); } });
/* Hold-to-unlock: 2″ with a progress ring; release early → back to 0. */
function holdBegin(btn) {
  const ring = btn.querySelector('[data-ring]'); holdStart = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - holdStart) / 2000); ring.style.strokeDashoffset = String(251.3 * (1 - p));
    if (p >= 1) { holdT = null; S.state = 'ok'; S.screen = 'race'; S.sheetOpen = false; render(); return; }
    holdT = requestAnimationFrame(step);
  };
  holdT = requestAnimationFrame(step);
}
function holdEnd() { if (holdT) cancelAnimationFrame(holdT); holdT = null; document.querySelectorAll('[data-ring]').forEach((r) => (r.style.strokeDashoffset = '251.3')); }
document.addEventListener('pointerdown', (e) => { const b = e.target.closest('[data-act="unlock"]'); if (b) { e.preventDefault(); holdBegin(b); } });
document.addEventListener('pointerup', holdEnd); document.addEventListener('pointercancel', holdEnd);
document.addEventListener('keydown', (e) => {
  const b = e.target.closest && e.target.closest('[data-act="unlock"]');
  if (b && (e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); holdBegin(b); }
  if (e.key === 'Escape' && S.sheetOpen) { S.sheetOpen = false; render(); }
});
document.addEventListener('keyup', (e) => { if (e.key === 'Enter' || e.key === ' ') holdEnd(); });
window.addEventListener('resize', () => render());

/* Deep links, e.g. #screen=race&state=now&theme=night&frame=p320&size=xl */
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => { if (k === 'sheet') S.sheetOpen = v !== '0'; else if (k in S) S[k] = v; });
makePhoto();
render();
</script>
</body>
